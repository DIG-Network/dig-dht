# dig-dht — a Kademlia DHT with PROVIDER RECORDS for the DIG Node peer network.
#
# The DHT answers one question: "which peers hold this content?" A node holding a `.dig` capsule /
# store / root PUTs a provider record keyed by a CONTENT ID; a node wanting that content does an
# iterative `find_providers(content_id)` lookup and gets back the set of `peer_id`s (with candidate
# addresses) holding it — then fetches the bytes over the L7 peer RPC (`dig.getAvailability` /
# `dig.fetchRange`, served over dig-nat mTLS connections). The DHT locates peers; dig-nat + the peer
# RPC move the bytes.
#
# Dependency philosophy (mirrors dig-nat's): keep the tree SMALL. The DHT rides dig-nat's transport
# (its `PeerId`, `PeerConnection`, `PeerSession` mux, and mTLS dial) and reuses ONE `PeerId` type
# from it — NOT the whole gossip stack. dig-gossip (and dig-constants) pull the entire
# chia-protocol/consensus stack, which a pure-Kademlia crate does not need; the DHT deliberately
# depends only on dig-nat so the tree stays minimal. The DHT's own wire (4 RPC methods) is small
# length-prefixed JSON, aligned to the L7 peer-network style, and is tested end-to-end over an
# in-memory transport harness (NO real network).
[package]
name = "dig-dht"
version = "0.12.0"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0 OR MIT"
description = "Kademlia DHT with provider records for the DIG Node peer network — maps DIG content (store / capsule / root / resource) to the peer_ids holding it, so a node can locate which peers have the content it wants and fetch it over the L7 peer RPC. peer_id = SHA-256(TLS SPKI DER), XOR-distance k-buckets, iterative find_node/find_providers, TTL'd + republished provider records, riding dig-nat mTLS transport."
repository = "https://github.com/DIG-Network/dig-dht"
readme = "README.md"
keywords = ["dht", "kademlia", "p2p", "provider", "dig"]
categories = ["network-programming"]

[dependencies]
# Peer identity (peer_id = SHA-256(TLS SPKI DER)) + the mTLS transport the DHT RPC rides. The DHT
# keys its k-buckets by `PeerId` — which dig-nat re-exports from dig-tls rather than owning — and its
# RPC rides dig-nat's mTLS connections, though the concrete `DhtTransport` impl lives in the host node
# (this crate names no dig-nat connection type in any signature).
#
# Sourcing: dig-nat is published to crates.io, so we resolve the plain crates.io version (NC-7:
# prefer the crates.io release over a bare-git source).
#
# `0.15` is where `SafeText` lives, and this crate now uses it in every text-carrying `DhtError`
# variant (#1675), so unlike the 0.13→0.14 bump this one is NOT pinned-version-only: `SafeText`
# appears in dig-dht's own PUBLIC API. That makes the dig-nat version part of dig-dht's contract, and
# a consumer that resolves a different dig-nat cannot name `DhtError::Transport`'s payload at all.
#
# The lockstep requirement from cascade #1668 therefore holds with MORE force, not less. A caret
# requirement on a `0.x` version treats the MINOR as the breaking position, so a `^0.14` pin can
# never resolve 0.15.0 however additive it is. A consumer that depends on dig-nat directly AND
# transitively through this crate (dig-download does exactly that, through dig-dht and dig-peer)
# would otherwise resolve TWO dig-nat copies — and now that a dig-nat type crosses dig-dht's API
# boundary, that resolves to a hard `E0308` on `SafeText` rather than merely to two mTLS stacks.
# "dig-nat 0.15 is published" is not the completion criterion; "every consumer's lock resolves
# dig-nat SINGLY" is.
#
# 0.11 and 0.12 are SKIPPED deliberately for the same arithmetic: both are published but
# semver-incompatible with each other, so no consumer could ever resolve 0.12 while pinning `0.11`.
#
# This release is a MINOR-and-breaking (`0.8`→`0.9`) on two counts, and both are honest type breaks
# rather than the runtime-coupling argument that justified the last one: `DhtError`'s three
# text-carrying variants changed payload type from `String` to `SafeText`, and `DhtError::transport`
# no longer accepts a `String`. A consumer matching on `DhtError::Transport(s)` and using `s` as a
# `String` must change. That is the intended cost: it is what makes raw peer text unrepresentable
# rather than merely discouraged.
dig-nat = "0.18"

# Address-family (IPv6-first / IPv4-fallback) contract — the ecosystem's single source of truth for
# `Family::of` classification (CLAUDE.md §5.2, epic #1020). The DHT derives the FAMILY half of its
# candidate-address sort key from here rather than hand-rolling an `is_ipv6` check, so it can never
# drift off the canonical rule; the dht-specific most-direct-first `AddressKind` rank stays its own
# tiebreak. Leaf crate — no other DIG dependency, resolved from crates.io.
dig-ip = "0.1"

# Async runtime for the service task + maintenance timers + lookup fan-out.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
async-trait = "0.1"

# The DHT RPC wire: small length-prefixed JSON messages (aligned to the L7 peer-network style).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Content-id hashing into the 256-bit keyspace (SHA-256, same digest family as peer_id).
sha2 = "0.10"

# Bucket-refresh jitter + random target selection for periodic self-lookup.
rand = "0.8"

# Structured errors + observability.
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
# The in-memory transport harness spins up many virtual nodes in one process (NO real network).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

[profile.release]
overflow-checks = true

